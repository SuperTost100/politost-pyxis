name: Diagnose Windows quit (temporary)

on:
  push:
    branches: [fix/windows-quit-hold]

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  PYXIS_E2E_HIDDEN: "1"
  PYXIS_CRASH_DIR: .tmp/ci-crashes

jobs:
  trace:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          build: "true"
      - name: Auto-backup spec, repeated
        run: npx playwright test tests/e2e/auto-backup.spec.ts --repeat-each=6 --workers=1 --reporter=list

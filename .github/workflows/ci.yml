name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyxis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            builder: --mac --arm64
          - target: mac-x64
            runner: macos-15-intel
            builder: --mac --x64
          - target: windows-x64
            runner: windows-2025
            builder: --win --x64
          - target: linux-x64
            runner: ubuntu-24.04
            builder: --linux --x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYXIS_E2E_HIDDEN: "1"
      PYXIS_TEST_E5: .tmp/e5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install Linux display and Electron libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libfuse2 apparmor
      - run: npm ci
      - name: Allow the Electron test binary to use its namespace sandbox
        if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            binary="$(node -p "require('electron')")"
            sudo tee /etc/apparmor.d/pyxis-ci >/dev/null <<EOF
          profile pyxis-ci "$binary" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/pyxis-ci
          fi
      - run: npm run typecheck
      - run: npm run test:fixtures
      - run: npm run build
      - name: Unit checks
        run: npm test -- --maxWorkers=2
      - name: Windows worker lifecycle with parent PDF engine
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        run: npx electron scripts/repro-extract-lifecycle.mjs --mode=full --runs=20
      - name: Windows worker lifecycle without parent PDF engine
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        run: npx electron scripts/repro-extract-lifecycle.mjs --mode=full --runs=20 --parent=none
      - name: Recorded Electron end-to-end checks
        run: |
          run_e2e() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a npx playwright test "$@" --workers=1
            else
              npx playwright test "$@" --workers=1
            fi
          }
          run_e2e tests/e2e/ocr-data.spec.ts tests/e2e/window.spec.ts
          run_e2e --grep-invert 'M14 every application|OCR data:|release loop:'
          for combo in it-dark-1280 it-dark-960 it-light-1280 it-light-960 en-dark-1280 en-dark-960 en-light-1280 en-light-960; do
            export PYXIS_UI_COMBO="$combo"
            export PYXIS_UI_RECORD="ci-audit/audit-$combo.json"
            run_e2e tests/e2e/ui-audit.spec.ts
            if [ "$RUNNER_OS" = macOS ] && [ "${{ matrix.target }}" = mac-arm64 ]; then
              export PYXIS_UI_LARGE=1
              export PYXIS_UI_RECORD="ci-audit/audit-$combo-large.json"
              run_e2e tests/e2e/ui-audit.spec.ts
              unset PYXIS_UI_LARGE
            fi
          done
      - name: Preserve route audit records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-audit-${{ matrix.target }}
          path: ci-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Package without publishing
        run: npm run dist -- ${{ matrix.builder }} --publish never
      - name: Check the packaged application
        run: |
          export PYXIS_DIST_APP="$(node --input-type=module <<'JS'
          import { existsSync } from 'node:fs';
          import { resolve } from 'node:path';
          const candidates = process.platform === 'darwin'
            ? ['dist/mac-arm64/PoliTost Pyxis.app/Contents/MacOS/PoliTost Pyxis', 'dist/mac/PoliTost Pyxis.app/Contents/MacOS/PoliTost Pyxis']
            : [process.platform === 'win32' ? 'dist/win-unpacked/PoliTost Pyxis.exe' : 'dist/linux-unpacked/politost-pyxis'];
          const found = candidates.filter(existsSync);
          if (found.length !== 1) throw new Error('Expected one packaged application');
          console.log(resolve(found[0]));
          JS
          )"
          if [ "$RUNNER_OS" = Linux ]; then
            if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo tee /etc/apparmor.d/pyxis-ci-packaged >/dev/null <<EOF
          profile pyxis-ci-packaged "$PYXIS_DIST_APP" flags=(unconfined) {
            userns,
          }
          EOF
              sudo apparmor_parser -r /etc/apparmor.d/pyxis-ci-packaged
            fi
            xvfb-run -a npx playwright test tests/e2e/window.spec.ts --workers=1
          else
            if [ "$RUNNER_OS" = macOS ]; then
              codesign --verify --deep --strict "$(dirname "$(dirname "$(dirname "$PYXIS_DIST_APP")")")"
            fi
            npx playwright test tests/e2e/window.spec.ts --workers=1
          fi
      - name: Collect installers and SHA-256 checksums
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, mkdirSync, copyFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const output = 'release-artifacts';
          mkdirSync(output);
          const names = readdirSync('dist', { withFileTypes: true })
            .filter(entry => entry.isFile() && /\.(?:dmg|zip|exe|AppImage|deb|blockmap)$/.test(entry.name))
            .map(entry => entry.name).sort();
          if (!names.some(name => /\.(?:dmg|exe|AppImage|deb)$/.test(name))) throw new Error('No installer built');
          const checksums = names.map(name => {
            copyFileSync(join('dist', name), join(output, name));
            return `${createHash('sha256').update(readFileSync(join(output, name))).digest('hex')}  ${name}`;
          });
          writeFileSync(join(output, 'SHA256SUMS'), checksums.join('\n') + '\n');
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyxis-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report-${{ matrix.target }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Report Windows application fault modules
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-50)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match '(?i)electron|politost|pyxis' } |
            Select-Object -First 5 -ExpandProperty Message

  attest:
    name: Attest packaged artifacts
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pyxis-*
          path: artifacts
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/**/*

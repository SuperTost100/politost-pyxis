name: Check

# The checks every pull request waits for, on Linux only: types, Markdown, scripts and unit tests in one job, and the
# recorded Electron end-to-end tests split into parallel shards. macOS, Windows, the route audits and the installers
# run in full.yml, by hand, on pull requests that change packaging or dependencies, and before every release.
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyxis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYXIS_E2E_HIDDEN: "1"
  PYXIS_TEST_E5: .tmp/e5
  PYXIS_CRASH_DIR: .tmp/ci-crashes

jobs:
  check:
    name: check linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          fixtures: "true"
          build: "true"
      - run: npm run typecheck
      - name: Markdown formatting
        run: npx prettier --check "**/*.md"
      - name: Script checks
        run: npm run test:scripts
      - name: Unit checks
        run: npm test -- --maxWorkers=2

  # The end-to-end tests took 23 minutes in one job in November 2026. Six shards run them side by side.
  e2e-shard:
    name: e2e linux-x64 (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          fixtures: "true"
          build: "true"
      - name: Recorded Electron end-to-end checks
        run: |
          # The OCR data and release-loop checks run first, as in full.yml, to expose core failures early.
          if [ "${{ matrix.shard }}" = 1 ]; then
            bash .github/actions/e2e/run.sh tests/e2e/ocr-data.spec.ts tests/e2e/window.spec.ts
          fi
          bash .github/actions/e2e/run.sh --grep-invert 'M14 every application|OCR data:|release loop:' --shard=${{ matrix.shard }}/6
      - name: Report end-to-end results
        if: always()
        uses: ./.github/actions/e2e
        with:
          name: test-report-linux-x64-${{ matrix.shard }}
          failed: ${{ job.status == 'failure' }}

  # One check for the ruleset to require, whatever the number of shards.
  e2e:
    name: e2e linux-x64
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.e2e-shard.result }}" = success

  # The crash-report Worker (crash-worker/) has its own packages and tests, run in workerd. Nothing here deploys it.
  crash-worker:
    name: Crash Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crash-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: crash-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
